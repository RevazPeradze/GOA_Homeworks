<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>ფოტო გადამრთველი</title>
</head>
<body>
<div class="gallery">
  <img id="photo" src="photo1.jpg" alt="photo">
  <div class="buttons">
    <button onclick="prevPhoto()">უკან</button>
    <button onclick="nextPhoto()">წინ</button>
  </div>
  <div class="bonus">
    <button onclick="bigger()">გადიდება</button>
    <button onclick="smaller()">დაპატარავება</button>
    <button onclick="round()">მომრგვალება</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
